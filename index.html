<!DOCTYPE html>
<html lang="en">
<head>
    <title>GAME</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <style>
        :root {
            --buttons-font-size: 18px;
            --buttons-line-height: calc(var(--buttons-font-size) * 1.2);
            --buttons-padding: 8px;
            --pixel-width: 7.4px;
            --line-width: 0.3px;
        }
        #leftTopButtons, #rightTopButtons {
            position: absolute;
            display: flex;
            flex-direction: row;
            gap: 5px;
            top: 10px;
        }
        #leftTopButtons {
            left: 10px;
        }
        #rightTopButtons {
            right: 10px;
        }
        #leftTopButtons div, #rightTopButtons div {
            color: white;
        }
        #leftTopButtons div:hover, #rightTopButtons div:hover {
            color: #AAAAAA;
        }
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: black;
            height: 100vh;
            width: 100vw;
            gap: 15px;
            user-select: none;
        }
        #level {
            color: white;
            font-size: 20px;
        }
        #wrapper {
            position: relative;
        }
        #canvas {
            display: grid;
            grid-template-columns: repeat(64, min(calc(100vw / 64), var(--pixel-width)));
            grid-template-rows: repeat(64, min(calc(100vw / 64), var(--pixel-width)));
            background-color: grey;
            cursor: not-allowed;
        }
        .filled {
            position: absolute;
            z-index: 9999;
            width: 100%;
            height: 100%;
            flex-direction: column;
            background-color: black;
            border: 2px solid purple;
            display: none;
            color: white;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            gap: 20px;
        }
        #gameover {
            border: 2px solid purple;
        }
        #victory {
            border: 2px solid aqua;
        }
        #levelComplete {
            border: 2px solid lime;
        }
        #tryAgainButton, #replayButton, #nextLevelButton {
            font-size: 20px;
            padding: 8px;
            color: white;
            border: inherit;
        }
        .pixel {
            width: min(calc((100vw * 63) / 64), var(--pixel-width));
            height: min(calc((100vw * 63) / 64), var(--pixel-width));
            background-color: darkgrey;
        }
        #buttons {
            padding: 0px 15px;
            display: flex;
            flex-direction: row;
            gap: 10px;
            align-items: center;
        }
        #move {
            position: relative;
            height: 90px;
            width: 130px;
            margin-right: 10px;
        }
        #buttons div:not(#move), #move div {
            background-color: #262626;
            font-size: var(--buttons-font-size);
            line-height: var(--buttons-line-height);
            padding: var(--buttons-padding);
            border-radius: calc((var(--buttons-line-height) + var(--buttons-padding) * 2) / 2);
            color: white;
        }
        #move div {
            width: var(--buttons-line-height);
            position: absolute;
        }
        #up {
            left: 50%;
            transform: translateX(-50%);
        }
        #down {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        #left {
            left: 0;
            top: 50%;
            transform: translateY(-50%);
        }
        #right {
            right: 0;
            top: 50%;
            transform: translateY(-50%);
        }
        #buttons div.hover:not(#move), #move div.hover, #buttons div:hover:not(#move), #move div:hover {
            background-color: #444444;
        }
        #lines {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .line {
            position: absolute;
            background: rgba(0,0,0,.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            mask-image: radial-gradient(100% 100% at 50% 50%, #000 75%, transparent);
            -webkit-mask-image: radial-gradient(100% 100% at 50% 50%, #000 75%, transparent);
        }
        .line.horizontal {
            left: 0;
            width: 100%;
            height: var(--line-width);
            transform: translateY(-50%);
        }
        .line.vertical {
            top: 0;
            height: 100%;
            width: var(--line-width);
            transform: translateX(-50%);
        }
        #topLine {
            width: 100%;
            height: calc(var(--line-width) / 2);
            background-color: black;
        }
        #bottomLine {
            bottom: 0;
            width: 100%;
            height: calc(var(--line-width) / 2);
            background-color: black;
        }
        #leftLine {
            left: 0;
            height: 100%;
            width: calc(var(--line-width) / 2);
            background-color: black;
        }
        #rightLine {
            right: 0;
            height: 100%;
            width: calc(var(--line-width) / 2);
            background-color: black;
        }
    </style>
</head>
<body>
    <div id="leftTopButtons">
        <div id="previousLevel">Previous Level</div>
        <div id="nextLevel">Next Level</div>
    </div>
    <div id="rightTopButtons">
        <div id="toggleLines">Show Lines</div>
    </div>
    <span id="level"></span>
    <div id="wrapper">
        <div id="gameover" class="filled">
            GAME OVER
            <div id="tryAgainButton">Try Again</div>
        </div>
        <div id="victory" class="filled">
            VICTORY!
            <div id="replayButton">Replay</div>
        </div>
        <div id="levelComplete" class="filled">
            LEVEL COMPLETE
            <div id="nextLevelButton">Next Level</div>
        </div>
        <div id="canvas"></div>
        <div id="lines">
            <div id="topLine"></div>
            <div id="bottomLine"></div>
            <div id="leftLine"></div>
            <div id="rightLine"></div>
        </div>
    </div>
    <div id="buttons">
        <div id="move">
            <div id="up">↑</div>
            <div id="down">↓</div>
            <div id="left">←</div>
            <div id="right">→</div>
        </div>
        <div id="undo">Space Bar</div>
        <div id="tryAgain">Try Again</div>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const pixelCount = 64 * 64;
        var level = 0;
        const levels = [];
        function pixels(index) {
            return [
                [
                    index,
                    index + 1,
                    index + 2,
                    index + 3
                ],
                [
                    index + 64,
                    index + 65,
                    index + 66,
                    index + 67
                ],
                [
                    index + 128,
                    index + 129,
                    index + 130,
                    index + 131
                ],
                [
                    index + 192,
                    index + 193,
                    index + 194,
                    index + 195
                ]
            ];
        }
        const colors = Object.freeze({ //常量 不仅引用不可变
            blocks: Object.freeze({
                1: 'deeppink',
                2: 'aqua',
                3: 'yellow',
                4: 'blue',
                5: 'green',
                6: 'red',
                p: Object.freeze({
                    1: 'papayawhip',
                    0: 'navajowhite'
                })
            }),
            midBG: 'darkgray',
            bilateralBG: 'lightslategray',
            topBar: 'orange',
            bottomBar: 'forestgreen',
            controlledCore: 'black',
            otherCore: 'dimgray',
            target: 'white'
        });

        for (let i = 1; i < 64; i++) {
            const line = document.createElement('div');
            line.classList.add('line', 'vertical');
            line.style.left = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pixel-width')) * i + 'px';
            document.getElementById('lines').appendChild(line);
        }
        for (let i = 1; i < 64; i++) {
            const line = document.createElement('div');
            line.classList.add('line', 'horizontal');
            line.style.top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pixel-width')) * i + 'px';
            document.getElementById('lines').appendChild(line);
        }
        for (let i = 0; i < pixelCount; i++) {
            const pixel = document.createElement('div');
            pixel.classList.add('pixel');
            canvas.appendChild(pixel);
        }
        fetch('game.json')
            .then(response => response.json())
            .then(data => {
                levels.push(...data);
                levels.forEach((item, i) => {
                    item.blocks.sort((a, b) => (b.type == 'p') - (a.type == 'p')); //让p块到最前面去
                    item.underControl = 1; //初始化
                    levels[i] = [item]; //变成数组成员再赋值给自己，从而变成嵌套数组，用于记录帧
                });
                drawFrame(true);
            });

        function drawFrame(firstStartup = false) {
            if (firstStartup) {
                levels[level][0].remainingSteps = levels[level][0].maxSteps; //启动关卡时配置步数
            }
            Array.from(canvas.children).forEach(item => {
                item.style.backgroundColor = colors.midBG;
            });
            document.getElementById('level').innerText = `LEVEL ${level + 1}/${levels.length}`;
            for (let i = 0; i < 64 * 2; i++) {
                canvas.children[i].style.backgroundColor = colors.bilateralBG;
            }
            for (let i = 0; i < Math.round(64 / levels[level][0].maxSteps * levels[level][0].remainingSteps); i++) {
                canvas.children[i].style.backgroundColor = colors.topBar;
            }
            for (let i = 0; i < 64 * 2; i++) {
                canvas.children[64 * (64 - 2) + i].style.backgroundColor = colors.bilateralBG;
            }
            for (let i = 0; i <= level; i++) {
                const width = Math.round((64 - levels.length) / (levels.length + 1));
                for (let j = 0; j < width; j++) {
                    canvas.children[64 * (64 - 1) + i * width + i + j].style.backgroundColor = colors.bottomBar;
                }
            }
            levels[level][0].blocks.forEach((item) => {
                for (let i = 0; i < item.h; i++) {
                    for (let j = 0; j < item.w; j++) {
                        let index = ((item.y - 1 + i) * 4 + 2) * 64 + ((item.x - 1 + j) * 4);
                        pixels(index).forEach((p, yindex) => {
                            p.forEach((q, xindex) => {
                                canvas.children[q].style.backgroundColor = (() => {
                                    switch (item.core?.corner) {
                                        case 'left-top':
                                            if (i < item.core.h && j < item.core.w && (xindex == 1 || xindex == 2) && (yindex == 1 || yindex == 2)) {
                                                return item.type == levels[level][0].underControl ? colors.controlledCore : colors.otherCore;
                                            }
                                            break;
                                        case 'left-bottom':
                                            if (item.h - i <= item.core.h && j < item.core.w && (xindex == 1 || xindex == 2) && (yindex == 1 || yindex == 2)) {
                                                return item.type == levels[level][0].underControl ? colors.controlledCore : colors.otherCore;
                                            }
                                            break;
                                        case 'right-top':
                                            if (i < item.core.h && item.w - j <= item.core.w && (xindex == 1 || xindex == 2) && (yindex == 1 || yindex == 2)) {
                                                return item.type == levels[level][0].underControl ? colors.controlledCore : colors.otherCore;
                                            }
                                            break;
                                        case 'right-bottom':
                                            if (item.h - i <= item.core.h && item.w - j <= item.core.w && (xindex == 1 || xindex == 2) && (yindex == 1 || yindex == 2)) {
                                                return item.type == levels[level][0].underControl ? colors.controlledCore : colors.otherCore;
                                            }
                                            break;
                                        case undefined:
                                            break;
                                    }
                                    if (item.type != 'p') {
                                        return colors.blocks[item.type];
                                    } else {
                                        return colors.blocks.p[(xindex + yindex + 1) % 2];
                                    }
                                })();
                            });
                        });
                    }
                }
            });
            checkAdjacentBlocks(getControl());
        }

        function updateRemainingSteps() {
            levels[level].unshift(JSON.parse(JSON.stringify(levels[level][0])));
            levels[level][0].remainingSteps--;
            for (let i = 0; i < 64 / levels[level][0].maxSteps; i++) {
                canvas.children[Math.round(64 / levels[level][0].maxSteps * levels[level][0].remainingSteps) + i].style.backgroundColor = colors.bilateralBG;
            }
        }

        function getControl() {
            return levels[level][0].blocks.find(item => item.type == levels[level][0].underControl);
        }

        function check() {
            if (!Array.from(canvas.children).some((item, index) => (index - 64 * 2) % 4 == 0 && Math.floor((index - 64 * 2) / 64) % 4 == 0 && item.style.backgroundColor == colors.blocks.p[1])) {
                if (level != levels.length - 1) {
                    document.getElementById('levelComplete').style.display = 'flex';
                    document.getElementById('buttons').style.visibility = 'hidden';
                } else {
                    document.getElementById('victory').style.display = 'flex';
                    document.getElementById('buttons').style.visibility = 'hidden';
                }
                return;
            }
            if (levels[level][0].remainingSteps == 0) {
                document.getElementById('gameover').style.display = 'flex';
                document.getElementById('buttons').style.visibility = 'hidden';
            }
        }

        function checkAdjacentBlocks(control) {
            levels[level][0].topTarget = (() => {
                let c;
                for (let i = 1; true; i++) {
                    let flag1, flag2 = false;
                    for (let j = 0; j < control.w; j++) {
                        let color = canvas.children[((control.y - 1 - i) * 4 + 2) * 64 + (control.x - 1 + j) * 4]?.style.backgroundColor;
                        if ([1,2,3,4,5,6].some(item => colors.blocks[item] == color)) {
                            if (color != c) {
                                if (flag1) {
                                    return null;
                                }
                                if (i == 1) {
                                    c = color;
                                    flag1 = true;
                                    continue;
                                }
                                flag2 = true;
                            } else {
                                if (flag2) {
                                    return null;
                                }
                                flag1 = true;
                            }
                        }
                    }
                    if (!flag1) {
                        const block = levels[level][0].blocks.find(item => colors.blocks[item.type] == c);
                        if (i > 1 && block.x >= control.x && block.x + block.w - 1 <= control.x + control.w - 1) {
                            return c;
                        } else {
                            return null;
                        }
                    }
                }
            })();
            if (levels[level][0].topTarget) {
                const block = levels[level][0].blocks.find(item => colors.blocks[item.type] == levels[level][0].topTarget);
                for (let i = 0; i < block.h; i++) {
                    for (let j = 0; j < block.w; j++) {
                        pixels(((block.y - 1 + i) * 4 + 2) * 64 + (block.x - 1 + j) * 4).forEach((p, yindex) => {
                            p.forEach((q, xindex) => {
                                if ((yindex == 1 || yindex == 2) && (xindex == 1 || xindex == 2)) {
                                    switch (block.core.corner) {
                                        case 'left-top':
                                            if (i < block.core.h && j < block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                        case 'left-bottom':
                                            if (i >= block.h - block.core.h && j < block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                        case 'right-top':
                                            if (i < block.core.h && j >= block.w - block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                        case 'right-bottom':
                                            if (i >= block.h - block.core.h && j >= block.w - block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                    }
                                }
                            });
                        });
                    }
                }
            }
            levels[level][0].bottomTarget = (() => {
                let c;
                for (let i = 1; true; i++) {
                    let flag1, flag2 = false;
                    for (let j = 0; j < control.w; j++) {
                        let color = canvas.children[((control.y - 2 + control.h + i) * 4 + 2) * 64 + (control.x - 1 + j) * 4]?.style.backgroundColor;
                        if ([1,2,3,4,5,6].some(item => colors.blocks[item] == color)) {
                            if (color != c) {
                                if (flag1) {
                                    return null;
                                }
                                if (i == 1) {
                                    c = color;
                                    flag1 = true;
                                    continue;
                                }
                                flag2 = true;
                            } else {
                                if (flag2) {
                                    return null;
                                }
                                flag1 = true;
                            }
                        }
                    }
                    if (!flag1) {
                        const block = levels[level][0].blocks.find(item => colors.blocks[item.type] == c);
                        if (i > 1 && block.x >= control.x && block.x + block.w - 1 <= control.x + control.w - 1) {
                            return c;
                        } else {
                            return null;
                        }
                    }
                }
            })();
            if (levels[level][0].bottomTarget) {
                const block = levels[level][0].blocks.find(item => colors.blocks[item.type] == levels[level][0].bottomTarget);
                for (let i = 0; i < block.h; i++) {
                    for (let j = 0; j < block.w; j++) {
                        pixels(((block.y - 1 + i) * 4 + 2) * 64 + (block.x - 1 + j) * 4).forEach((p, yindex) => {
                            p.forEach((q, xindex) => {
                                if ((yindex == 1 || yindex == 2) && (xindex == 1 || xindex == 2)) {
                                    switch (block.core.corner) {
                                        case 'left-top':
                                            if (i < block.core.h && j < block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                        case 'left-bottom':
                                            if (i >= block.h - block.core.h && j < block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                        case 'right-top':
                                            if (i < block.core.h && j >= block.w - block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                        case 'right-bottom':
                                            if (i >= block.h - block.core.h && j >= block.w - block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                    }
                                }
                            });
                        });
                    }
                }
            }
            levels[level][0].leftTarget = (() => {
                let c;
                for (let i = 1; true; i++) {
                    let flag1, flag2 = false;
                    for (let j = 0; j < control.h; j++) {
                        let color = canvas.children[((control.y - 1 + j) * 4 + 2) * 64 + (control.x - 1 - i) * 4]?.style.backgroundColor;
                        if ([1,2,3,4,5,6].some(item => colors.blocks[item] == color)) {
                            if (color != c) {
                                if (flag1) {
                                    return null;
                                }
                                if (i == 1) {
                                    c = color;
                                    flag1 = true;
                                    continue;
                                }
                                flag2 = true;
                            } else {
                                if (flag2) {
                                    return null;
                                }
                                flag1 = true;
                            }
                        }
                    }
                    if (!flag1) {
                        const block = levels[level][0].blocks.find(item => colors.blocks[item.type] == c);
                        if (i > 1 && block.y >= control.y && block.y + block.h - 1 <= control.y + control.h - 1) {
                            return c;
                        } else {
                            return null;
                        }
                    }
                }
            })();
            if (levels[level][0].leftTarget) {
                const block = levels[level][0].blocks.find(item => colors.blocks[item.type] == levels[level][0].leftTarget);
                for (let i = 0; i < block.h; i++) {
                    for (let j = 0; j < block.w; j++) {
                        pixels(((block.y - 1 + i) * 4 + 2) * 64 + (block.x - 1 + j) * 4).forEach((p, yindex) => {
                            p.forEach((q, xindex) => {
                                if ((yindex == 1 || yindex == 2) && (xindex == 1 || xindex == 2)) {
                                    switch (block.core.corner) {
                                        case 'left-top':
                                            if (i < block.core.h && j < block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                        case 'left-bottom':
                                            if (i >= block.h - block.core.h && j < block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                        case 'right-top':
                                            if (i < block.core.h && j >= block.w - block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                        case 'right-bottom':
                                            if (i >= block.h - block.core.h && j >= block.w - block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                    }
                                }
                            });
                        });
                    }
                }
            }
            levels[level][0].rightTarget = (() => {
                let c;
                for (let i = 1; true; i++) {
                    let flag1, flag2 = false;
                    for (let j = 0; j < control.h; j++) {
                        let color = canvas.children[((control.y - 1 + j) * 4 + 2) * 64 + (control.x - 2 + control.w + i) * 4]?.style.backgroundColor;
                        if ([1,2,3,4,5,6].some(item => colors.blocks[item] == color)) {
                            if (color != c) {
                                if (flag1) {
                                    return null;
                                }
                                if (i == 1) {
                                    c = color;
                                    flag1 = true;
                                    continue;
                                }
                                flag2 = true;
                            } else {
                                if (flag2) {
                                    return null;
                                }
                                flag1 = true;
                            }
                        }
                    }
                    if (!flag1) {
                        const block = levels[level][0].blocks.find(item => colors.blocks[item.type] == c);
                        if (i > 1 && block.y >= control.y && block.y + block.h - 1 <= control.y + control.h - 1) {
                            return c;
                        } else {
                            return null;
                        }
                    }
                }
            })();
            if (levels[level][0].rightTarget) {
                const block = levels[level][0].blocks.find(item => colors.blocks[item.type] == levels[level][0].rightTarget);
                for (let i = 0; i < block.h; i++) {
                    for (let j = 0; j < block.w; j++) {
                        pixels(((block.y - 1 + i) * 4 + 2) * 64 + (block.x - 1 + j) * 4).forEach((p, yindex) => {
                            p.forEach((q, xindex) => {
                                if ((yindex == 1 || yindex == 2) && (xindex == 1 || xindex == 2)) {
                                    switch (block.core.corner) {
                                        case 'left-top':
                                            if (i < block.core.h && j < block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                        case 'left-bottom':
                                            if (i >= block.h - block.core.h && j < block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                        case 'right-top':
                                            if (i < block.core.h && j >= block.w - block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                        case 'right-bottom':
                                            if (i >= block.h - block.core.h && j >= block.w - block.core.w) {
                                                canvas.children[q].style.backgroundColor = colors.target;
                                            }
                                            break;
                                    }
                                }
                            });
                        });
                    }
                }
            }
            if (levels[level][1]) {
                [levels[level][1].topTarget, levels[level][1].bottomTarget, levels[level][1].leftTarget, levels[level][1].rightTarget]
                    .filter(item => ![levels[level][0].topTarget, levels[level][0].bottomTarget, levels[level][0].leftTarget, levels[level][0].rightTarget].includes(item)).forEach(c => {
                    if (c == colors.blocks[levels[level][0].underControl]) {
                        return;
                    }
                    const block = levels[level][0].blocks.find(item => colors.blocks[item.type] == c);

        document.addEventListener('keydown', (e) => {

                    Array.from(document.querySelectorAll('.filled')).find(item => item.style.display == 'flex').querySelector('div').click();
                }
                return;
            }
            switch (e.key) {
                case 'ArrowUp':
                    up();
                    document.getElementById('up').classList.add('hover');
                    break;
                case 'ArrowDown': 
                    down();
                    document.getElementById('down').classList.add('hover');
                    break;
                case 'ArrowLeft':
                    left();
                    document.getElementById('left').classList.add('hover');
                    break;
                case 'ArrowRight':
                    right();
                    document.getElementById('right').classList.add('hover');
                    break;
                case ' ':
                    document.getElementById('undo').click();
                    document.getElementById('undo').classList.add('hover');
                    break;
            }
            check();
        });

            switch (e.key) {
                case 'ArrowUp':
                    document.getElementById('up').classList.remove('hover');
                    break;
                case 'ArrowDown': 
                    document.getElementById('down').classList.remove('hover');
                    break;
                case 'ArrowLeft':
                    document.getElementById('left').classList.remove('hover');
                    break;
                case 'ArrowRight':
                    document.getElementById('right').classList.remove('hover');
                    break;
                case ' ':
                    document.getElementById('undo').classList.remove('hover');
                    break;
            }
        });

            up();
            check();
        });

            down();
            check();
        });

            left();
            check();
        });
        document.getElementById('right').addEventListener('click', () => {
            right();
            check();
        });
        document.getElementById('undo').addEventListener('click', () => {
            if (levels[level].length != 1) {
                levels[level][1].remainingSteps = levels[level][0].remainingSteps;
                levels[level].shift();
                levels[level][0].remainingSteps--;
                drawFrame();
                check();
            }
        });
        document.getElementById('tryAgain').addEventListener('click', () => {
            levels[level] = [levels[level].at(-1)];
            drawFrame(true);
        });

            document.getElementById('buttons').style.visibility = 'visible';

        document.getElementById('toggleLines').addEventListener('click', () => {

                document.getElementById('toggleLines').innerText = 'Hide Lines';
